name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize]
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/SECURITY.md'
      - '.slsa-goreleaser/**'
      - '.gitignore'
      - 'docs/**'
      - '**.md'

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
    - name: Check PR Title
      uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          build
          ci
          chore
          revert
        requireScope: false
        subjectPattern: ^(?![A-Z]).+$
        subjectPatternError: |
          The subject "{subject}" found in the pull request title "{title}"
          didn't match the configured pattern. Please ensure that the subject
          doesn't start with an uppercase character.

  # The server embeds the SPA via //go:embed internal/web/dist, which is
  # gitignored and built at compile time (make web-bundle / Dockerfile).
  # This job proves the embed contract from a clean checkout: the SPA
  # builds, stages, and the Go side can serve it. (It used to diff a
  # committed dist; that guard is meaningless now that dist is not tracked.)
  check-embed-fresh:
    runs-on: ubuntu-latest
    needs: validate-pr
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - uses: ./.github/actions/stage-web-spa

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod

    - name: Embedded SPA serves from a clean build
      run: go test ./internal/web/...

  check-acceptance-tests:
    runs-on: ubuntu-latest
    needs: validate-pr
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        persist-credentials: false

    - name: Run acceptance tests with Dagger
      uses: dagger/dagger-for-github@e47aba410ef9bb9ed81a4d2a97df31061e5e842e # 8.0.0
      with:
        verb: call
        module: ./ci
        args: acceptance-test --source .
      continue-on-error: true

    - name: Comment PR
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      if: failure()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '⚠️ Acceptance tests failed. Please check the logs and fix any issues.'
          })