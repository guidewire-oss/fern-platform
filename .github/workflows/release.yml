name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write # needed for signing with cosign

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0
        ref: ${{ github.event.inputs.tag || github.ref }}

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.24'
        check-latest: true

    # The Go binary embeds the SPA via //go:embed internal/web/dist.
    # goreleaser runs `go build` directly (no Docker multi-stage), so it
    # would otherwise embed whatever internal/web/dist happens to be
    # committed. Rebuild + restage from web-v2/src here so every release
    # embeds the current SPA regardless of the committed artifact.
    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20

    - name: Build and stage web-v2 SPA
      run: |
        corepack enable
        cd web-v2
        pnpm install --frozen-lockfile
        pnpm build
        cd ..
        rm -rf internal/web/dist
        mkdir -p internal/web/dist
        cp -R web-v2/dist/. internal/web/dist/

    - name: Install cosign
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

    - name: Install syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Install mockgen
      run: go install github.com/golang/mock/mockgen@v1.6.0

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
      with:
        distribution: goreleaser
        version: ~> v2
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        COSIGN_EXPERIMENTAL: 1

